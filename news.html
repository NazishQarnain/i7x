<!DOCTYPE html>
<!-- App version: 1.6.1 — see CHANGELOG.md for history -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />
    <title>Nearby News - Details</title>
    <link rel="icon" type="image/png" href="logo.png" />
    <meta name="theme-color" content="#1e293b" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Navbar -->
    <header class="top-nav">
      <div class="nav-left">
        <button id="menuToggle" class="menu-btn">&#9776;</button>
        <img src="logo.png" alt="Nearby News logo" class="app-logo" />
        <span class="app-title">Nearby News</span>
      </div>
      <button id="themeToggle" class="menu-btn" aria-label="Toggle dark mode">🌓</button>
      <nav id="sideMenu" class="side-menu">
        <a href="index.html">Home</a>
        <a href="login.html">Login / Signup</a>
        <a href="account.html">Account</a>
        <a href="app.html">Create / Nearby News</a>
        <a href="map.html">Live Map</a>
        <a href="admin.html">Admin</a>
        <div class="side-menu-version">v<span id="appVersion"></span></div>
      </nav>
      <div id="backdrop" class="backdrop"></div>
    </header>

    <main class="news-detail-container">
      <button id="backBtn" class="back-btn">← Back</button>

      <div id="hazardBanner" style="display: none;"></div>
      <h2 id="newsTitle">Loading...</h2>
      <p id="newsMeta" class="news-meta"></p>
      <img
        id="newsImage"
        class="news-detail-image"
        style="display: none;"
        alt="News image"
      />
      <p id="newsBody" class="news-body"></p>

      <div class="news-detail-actions" id="newsActions"></div>
    </main>

    <!-- Firebase v8 -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="firebaseConfig.js"></script>
    <script src="credibility.js"></script>
    <script src="explore.js"></script>

    <!-- Navbar JS -->
    <script src="nav.js" defer></script>

    <script>
      const db = firebase.firestore();

      // Shared road-hazard metadata (mirrored in app.js / index.html /
      // map.html since this is a plain static site with no shared JS
      // module system).
      const HAZARD_TYPES = {
        road_damage: { label: "Road Damage", emoji: "🚧", color: "#f97316" },
        bridge_damage: { label: "Bridge Damage/Closed", emoji: "🌉", color: "#dc2626" },
        accident: { label: "Accident", emoji: "🚗", color: "#b91c1c" },
        flooding: { label: "Flooding", emoji: "🌊", color: "#0284c7" },
        other_hazard: { label: "Road Hazard", emoji: "⚠️", color: "#ca8a04" }
      };

      function getQueryParam(name) {
        const params = new URLSearchParams(window.location.search);
        return params.get(name);
      }

      function formatMeta(data) {
        const parts = [];

        if (data.createdAt && data.createdAt.toDate) {
          parts.push(data.createdAt.toDate().toLocaleString("en-IN"));
        }

        if (data.address) {
          parts.push(data.address);
        }

        if (parts.length === 0) return "";
        return parts.join(" • ");
      }

      async function loadNewsDetail() {
        const id = getQueryParam("id");
        const titleEl = document.getElementById("newsTitle");
        const metaEl = document.getElementById("newsMeta");
        const bodyEl = document.getElementById("newsBody");
        const imgEl = document.getElementById("newsImage");
        const actionsEl = document.getElementById("newsActions");

        if (!id) {
          if (titleEl) titleEl.textContent = "No news id provided.";
          return;
        }

        try {
          const doc = await db.collection("posts").doc(id).get();
          if (!doc.exists) {
            if (titleEl) titleEl.textContent = "News not found.";
            return;
          }

          const data = doc.data();
          // Count an "open" for interest only the first time, so refreshing
          // the page can't inflate a category's weight.
          if (!Explore.wasSeen(id)) Explore.bump(data, "open");
          Explore.markSeen(id);
          // Wait for the optional ML model, but never longer than 1.5 s.
          await Promise.race([Credibility.ready, new Promise((r) => setTimeout(r, 1500))]);
          if (actionsEl) Explore.mountActions(actionsEl, db, id, data, null);
          const cred = Credibility.assess(data);
          if (cred.level !== "ok" && actionsEl) {
            const warn = document.createElement("div");
            const b = Credibility.badge(data);
            if (b) warn.appendChild(b);
            if (cred.reasons.length) {
              const ul = document.createElement("ul"); ul.className = "cred-reasons";
              cred.reasons.forEach((t) => { const li = document.createElement("li"); li.textContent = t; ul.appendChild(li); });
              warn.appendChild(ul);
            }
            actionsEl.parentNode.insertBefore(warn, actionsEl);
          }
          const title = data.title || "Untitled News";
          const content = data.content || "";
          const meta = formatMeta(data);

          // Enhancement: a prominent colored banner at the top of the
          // detail page for hazard posts, so it's unmissable when someone
          // opens the post directly (e.g. from a shared link).
          const hazardBanner = document.getElementById("hazardBanner");
          const hazardMeta = data.hazardType ? HAZARD_TYPES[data.hazardType] : null;
          if (hazardBanner && hazardMeta) {
            hazardBanner.style.display = "block";
            hazardBanner.style.background = hazardMeta.color;
            hazardBanner.style.color = "#fff";
            hazardBanner.style.padding = "8px 14px";
            hazardBanner.style.borderRadius = "8px";
            hazardBanner.style.fontWeight = "700";
            hazardBanner.style.marginBottom = "10px";
            hazardBanner.style.fontSize = "14px";
            hazardBanner.textContent = `${hazardMeta.emoji} ${hazardMeta.label}`;
          }

          if (titleEl) titleEl.textContent = title;
          if (metaEl) metaEl.textContent = meta;
          if (bodyEl) bodyEl.textContent = content;

          // Enhancement: the browser tab always showed the generic
          // "Nearby News - Details" title, even after the actual post
          // loaded — made it hard to tell tabs apart when multiple
          // posts were open.
          document.title = title + " - Nearby News";

          if (data.imageUrl && imgEl) {
            // Bug fix: a dead/expired ImgBB link used to show a broken
            // image icon on the detail page; hide it instead.
            imgEl.onerror = () => {
              imgEl.style.display = "none";
            };
            imgEl.src = data.imageUrl;
            imgEl.style.display = "block";
          }

          if (
            actionsEl &&
            data.location &&
            typeof data.location.latitude === "number" &&
            typeof data.location.longitude === "number" &&
            !(data.location.latitude === 0 && data.location.longitude === 0)
          ) {
            const lat = data.location.latitude;
            const lng = data.location.longitude;
            const mapsUrl = `https://www.google.com/maps?q=${lat},${lng}`;

            const mapsLink = document.createElement("a");
            mapsLink.href = mapsUrl;
            mapsLink.target = "_blank";
            mapsLink.rel = "noopener noreferrer";
            mapsLink.textContent = "Open in Google Maps";

            actionsEl.appendChild(mapsLink);
          }
        } catch (e) {
          console.error("Error loading news detail:", e);
          if (titleEl) titleEl.textContent = "Error loading news.";
        }
      }

      document.addEventListener("DOMContentLoaded", () => {
        const backBtn = document.getElementById("backBtn");
        if (backBtn) {
          backBtn.addEventListener("click", () => {
            if (window.history.length > 1) {
              window.history.back();
            } else {
              window.location.href = "index.html";
            }
          });
        }

        loadNewsDetail();
      });
    </script>
  </body>
</html>
