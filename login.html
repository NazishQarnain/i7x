<!doctype html>
<!-- App version: 1.10.10 — see CHANGELOG.md for history -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />
    <title>Nearby News - Login</title>
    <link rel="icon" type="image/png" href="logo.png" />
    <meta name="theme-color" content="#1e293b" />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- Navbar -->
    <header class="top-nav">
      <div class="nav-left">
        <button id="menuToggle" class="menu-btn">&#9776;</button>
        <img src="logo.png" alt="Nearby News logo" class="app-logo" />
        <span class="app-title">Nearby News</span>
      </div>
      <button id="themeToggle" class="menu-btn" aria-label="Toggle dark mode">🌓</button>
      <nav id="sideMenu" class="side-menu">
        <a href="index.html">Home</a>
        <a href="login.html">Login / Signup</a>
        <a href="account.html">Account</a>
        <a href="app.html">Create / Nearby News</a>
        <a href="map.html">Live Map</a>
        <a href="admin.html">Admin</a>
        <div class="side-menu-version">v<span id="appVersion"></span></div>
      </nav>
      <div id="backdrop" class="backdrop"></div>
    </header>

    <main class="auth-container">
      <section class="panel auth-panel">
        <h2 id="authTitle">Login / Signup</h2>

        <div id="authForm">
          <input id="authEmail" type="email" placeholder="Email" autocomplete="email" />
          <div class="pw-row">
            <input id="authPassword" type="password" placeholder="Password (min 6 characters)" autocomplete="current-password" />
            <button type="button" id="pwToggle" class="pw-toggle" aria-label="Show password">👁</button>
          </div>

          <div class="btn-row">
            <button id="authSignupBtn">Sign up</button>
            <button id="authLoginBtn">Login</button>
          </div>
          <p><a href="#" id="forgotLink">Forgot password?</a></p>
        </div>

        <div id="loggedInBox" style="display: none;">
          <p id="loggedInText"></p>
          <div class="btn-row">
            <a href="index.html"><button type="button">Home</button></a>
            <a href="app.html"><button type="button">Create news</button></a>
            <a href="account.html"><button type="button">Account</button></a>
          </div>
          <div class="btn-row" style="margin-top: 10px;">
            <button id="authLogoutBtn">Logout</button>
          </div>
        </div>

        <p id="authStatus" class="auth-status" role="status" aria-live="polite">
          Not logged in.
        </p>
      </section>
    </main>

    <!-- Firebase v8 -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="firebaseConfig.js"></script>

    <!-- Simple auth logic only for this page -->
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const $ = (id) => document.getElementById(id);
        const emailEl = $("authEmail"), passEl = $("authPassword");
        const signupBtn = $("authSignupBtn"), loginBtn = $("authLoginBtn"), logoutBtn = $("authLogoutBtn");
        const statusEl = $("authStatus"), formEl = $("authForm"), boxEl = $("loggedInBox");
        const titleEl = $("authTitle"), forgotEl = $("forgotLink"), pwToggle = $("pwToggle");

        const say = (msg, isError) => {
          statusEl.textContent = msg;
          statusEl.style.color = isError ? "#b91c1c" : "";
        };

        // Friendly messages instead of raw Firebase error text.
        const FRIENDLY = {
          "auth/invalid-email": "That email address doesn't look right.",
          "auth/user-not-found": "No account with that email. Try Sign up.",
          "auth/wrong-password": "Wrong password. Try again or use Forgot password.",
          "auth/invalid-credential": "Wrong email or password.",
          "auth/invalid-login-credentials": "Wrong email or password.",
          "auth/email-already-in-use": "An account with this email already exists. Try Login.",
          "auth/weak-password": "Password is too weak. Use at least 6 characters.",
          "auth/too-many-requests": "Too many attempts. Please wait a few minutes and try again.",
          "auth/network-request-failed": "Network problem. Check your internet and try again."
        };
        const friendly = (e) => FRIENDLY[e && e.code] || (e && e.message) || "Something went wrong.";

        function setUI(user) {
          const loggedIn = !!user;
          // Bug fix: email/password fields and the "Login / Signup" title
          // stayed visible while logged in. Show a proper logged-in view.
          formEl.style.display = loggedIn ? "none" : "";
          boxEl.style.display = loggedIn ? "" : "none";
          titleEl.textContent = loggedIn ? "You're logged in" : "Login / Signup";
          if (loggedIn) {
            $("loggedInText").textContent = "Signed in as " + (user.email || "unknown");
            say("");
          } else {
            say("Not logged in.");
          }
        }
        firebase.auth().onAuthStateChanged(setUI);

        const getVal = (el) => (el ? el.value.trim() : "");
        const setBusy = (busy) => [signupBtn, loginBtn].forEach((b) => { if (b) b.disabled = busy; });

        async function submit(kind) {
          const email = getVal(emailEl), pass = getVal(passEl);
          if (!email || !pass) { say("Please fill email and password.", true); return; }
          setBusy(true); say(kind === "signup" ? "Creating account..." : "Logging in...");
          try {
            const auth = firebase.auth();
            if (kind === "signup") await auth.createUserWithEmailAndPassword(email, pass);
            else await auth.signInWithEmailAndPassword(email, pass);
            window.location.href = "app.html";
          } catch (e) {
            say(friendly(e), true);
          } finally {
            setBusy(false);
          }
        }

        signupBtn.addEventListener("click", () => submit("signup"));
        loginBtn.addEventListener("click", () => submit("login"));
        logoutBtn.addEventListener("click", () => {
          firebase.auth().signOut().catch((e) => say(friendly(e), true));
        });

        // Enhancement: Forgot password (Firebase sends the reset email).
        forgotEl.addEventListener("click", async (ev) => {
          ev.preventDefault();
          const email = getVal(emailEl);
          if (!email) { say("Type your email above first, then tap Forgot password.", true); return; }
          try {
            await firebase.auth().sendPasswordResetEmail(email);
            say("Password reset email sent. Check your inbox (and spam).");
          } catch (e) {
            say(friendly(e), true);
          }
        });

        // Enhancement: show / hide password.
        pwToggle.addEventListener("click", () => {
          const show = passEl.type === "password";
          passEl.type = show ? "text" : "password";
          pwToggle.setAttribute("aria-label", show ? "Hide password" : "Show password");
        });

        // Enter submits login, but never while busy or while logged in
        // (the old handler fired even when the form was hidden).
        [emailEl, passEl].forEach((el) => el.addEventListener("keydown", (e) => {
          if (e.key === "Enter" && !loginBtn.disabled && formEl.style.display !== "none") submit("login");
        }));
      });
    </script>

    <!-- Navbar JS -->
    <script src="nav.js" defer></script>
  </body>
</html>
